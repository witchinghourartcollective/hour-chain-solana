[package]
name = "hour-consent-litesvm-tests"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dev-dependencies]
hour-consent = { path = "../../programs/hour-consent", features = ["no-entrypoint"] }
litesvm = { version = "0.17", features = ["precompiles"] }
